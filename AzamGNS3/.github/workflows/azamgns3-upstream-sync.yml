name: "AzamGNS3 Daily Upstream Check"

on:
  schedule:
    # Run daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AzamGNS3 Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gns3-server/requirements.txt || true
          pip install -e gns3-server || true

      - name: Check Upstream Changes
        run: |
          python scripts/azamgns3-update-checker.py --generate-patches

      - name: Upload Audit Reports & Patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-audit-reports
          path: |
            docs/reports/*.md
            docs/reports/upstream_state.json
            docs/reports/patches/
