<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AzamLabs — Sign in</title>
	<link rel="icon" href="/branding/api.php?action=logo">
	<link rel="stylesheet" href="/login/login.css?v=azamlabs-dark">
</head>
<body>
	<main class="login-wrap">
		<div class="brand">
			<img class="brand-logo" id="brand-logo" data-brand-logo src="/branding/api.php?action=logo" alt="AzamLabs">
			<span class="brand-mark" id="brand-mark" hidden>AL</span>
			<span class="brand-text" data-brand-name>AzamLabs</span>
		</div>
		<p class="login-header" id="login-header" hidden></p>
		<p class="version-line" id="version-line">Version: <span id="version-value">&hellip;</span></p>
		<p class="default-account" id="default-account">Default account: <strong>admin</strong> / <strong>azam</strong></p>

		<form class="login-card" id="login-form" autocomplete="on">
			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" autocomplete="username"
					autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required>
			</div>
			<div class="field">
				<label for="console-pref">Console</label>
				<select id="console-pref" name="console-pref">
					<option value="native" selected>Default Console</option>
					<option value="html5">HTML5 Console</option>
				</select>
			</div>

			<div class="alert" id="alert" role="alert" hidden></div>

			<button class="btn" id="submit" type="submit">
				<span class="btn-label">Sign in</span>
				<span class="btn-spin" aria-hidden="true"></span>
			</button>
		</form>
		<p class="footnote">Offline appliance access</p>
	</main>

	<script src="/assets-common/js/pnq-branding.js?v=azamlabs-dark"></script>
	<script src="/login/login.js?v=azamlabs-dark"></script>
</body>
</html>
