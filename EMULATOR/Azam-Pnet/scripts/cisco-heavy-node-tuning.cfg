! ==============================================================================
! Azam Basha In-Router Performance & Resource Tuning Configurations
! Supports: Cisco Catalyst 8000 (C8000v), Cisco 8000 (XR7), Catalyst 9000 (Cat9kv)
!
! Purpose:
! 1. Suppresses unnecessary internal telemetry churn that dirties memory pages,
!    allowing Linux Kernel Samepage Merging (KSM) to achieve >70% deduplication.
! 2. Configures DPDK dataplane power-saving / sleep mode during idle intervals.
! 3. Preserves full wire-speed routing, switching, and protocol performance.
! ==============================================================================

! ------------------------------------------------------------------------------
! SECTION 1: Cisco Catalyst 8000v & CSR1000v (IOS-XE) Tuning
! ------------------------------------------------------------------------------
configure terminal
!
! Disable unnecessary telemetry and background polling churn
no telemetry ietf subscription all
no service config
!
! Optimize QFP/DPDK dataplane monitor overhead
platform qfp utilization monitor disable
!
! Allocate deterministic CPU budget for BFD and control plane
platform bfd-cpu-allocation 1
!
! Optimize console/vty logging rate
logging buffered 64000 informational
logging rate-limit 1000
!
! Disable DNS resolution timeouts in lab environment
no ip domain lookup
!
end
write memory

! ------------------------------------------------------------------------------
! SECTION 2: Cisco Catalyst 9000v (C9300v / C9500v - IOS-XE Switch) Tuning
! ------------------------------------------------------------------------------
configure terminal
!
! Disable unnecessary periodic ASIC diagnostic loops in simulation
no diagnostic bootup level complete
diagnostic bootup level minimal
!
! Suppress unused switch telemetry churn
no telemetry ietf subscription all
no service config
!
! Optimize STP and control plane timers
spanning-tree mode rapid-pvst
!
end
write memory

! ------------------------------------------------------------------------------
! SECTION 3: Cisco 8000 Series (IOS-XR7) Tuning
! ------------------------------------------------------------------------------
! In Cisco IOS-XR7 configuration mode:
!
performance-mgmt disable
logging buffered 10000000
!
! Disable unnecessary gRPC / telemetry streams if not being tested
telemetry model-driven
  no destination-group *
!
commit
