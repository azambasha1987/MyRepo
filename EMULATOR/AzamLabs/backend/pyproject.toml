[project]
name = "azamlabs"
version = "1.0.0"
description = "AzamLabs Universal Network & Cloud Security Emulation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "click>=8.1.0",
]

[project.scripts]
azam = "azamlabs.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
