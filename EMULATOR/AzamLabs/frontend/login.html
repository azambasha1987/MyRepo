<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AzamLabs — Cyber Command Deck Sign In</title>
  <meta name="description" content="Sign in to AzamLabs Next-Gen Universal Network, Cloud & Cybersecurity Studio.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/widget.css">
</head>
<body>


  <!-- Top Telemetry Ticker -->
  <div class="telemetry-ticker">
    <div class="ticker-status">
      <div class="ticker-dot"></div>
      <span>SYSTEM ARMED // QUANTUM WAL READY // KSM 100:1 DEDUP</span>
    </div>
    <div>NODE CLUSTERS: ACTIVE</div>
  </div>

  <!-- Interactive 60 FPS Bounded Particle Canvas -->
  <canvas id="cyberCanvas"></canvas>

  <!-- Cyber Matrix Ambient Background -->
  <div class="cyber-bg">
    <div class="cyber-grid"></div>
    <div class="cyber-scanlines"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="login-container">
    <!-- Holographic Floating Circular Avatar Unit with Biometric Laser -->
    <div class="avatar-hero-unit">
      <div class="avatar-aura-glow"></div>
      <div class="laser-sweep-ring"></div>
      <div class="biometric-laser"></div>
      <div class="avatar-circle">
        <img class="avatar-img" src="/assets/logo.png" alt="AzamLabs Crest">
      </div>
    </div>

    <!-- Login Card with 3D Parallax & Corner Brackets -->
    <div class="login-card">
      <div class="bracket bracket-tl"></div>
      <div class="bracket bracket-tr"></div>
      <div class="bracket bracket-bl"></div>
      <div class="bracket bracket-br"></div>

      <div class="card-header">
        <h1 class="brand-title">AZAMLABS</h1>
        <p class="brand-subtitle">Universal Network, Cloud & Cyber Studio</p>
      </div>

      <div id="loginError" class="error-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMessage">Invalid credentials. Please enter azam / azam.</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="input-label" for="username">
            <span>Operator Identity</span>
            <span style="color:var(--text-muted); font-size:0.7rem;">DEFAULT: AZAM</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input id="username" class="cyber-input" type="text" placeholder="azam" autocomplete="username" required value="azam">
          </div>
        </div>

        <div class="form-group">
          <label class="input-label" for="password">
            <span>Security Passkey</span>
            <span style="color:var(--text-muted); font-size:0.7rem;">DEFAULT: AZAM</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="password" class="cyber-input" type="password" placeholder="••••" autocomplete="current-password" required value="azam">
            <button type="button" id="btnTogglePassword" class="toggle-password" title="Show/Hide Password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" class="cyber-checkbox" checked>
            <span>Retain Cryptographic Session</span>
          </label>
          <span style="font-size:0.75rem; color:var(--neon-cyan); font-family:var(--font-mono);">v2.4.0</span>
        </div>

        <button type="submit" id="btnLogin" class="btn-login">
          <span>Authorize Access</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <div class="footer-info">
        <span>CREDENTIALS:</span>
        <button type="button" class="quick-cred-chip" id="btnAutofill">
          <span>azam / azam</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Client-Side Authentication Gatekeeper & FX -->
  <script src="/js/auth.js"></script>
  <script src="/js/widget.js"></script>
  <script src="/js/login-fx.js"></script>
  <script>
    // Password toggle handler
    const btnToggle = document.getElementById('btnTogglePassword');
    const pwdInput = document.getElementById('password');
    btnToggle.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      if (window.tacticalWidget) window.tacticalWidget.playClick(900);
    });

    // Quick fill autofill chip
    document.getElementById('btnAutofill').addEventListener('click', () => {
      document.getElementById('username').value = 'azam';
      document.getElementById('password').value = 'azam';
      if (window.tacticalWidget) window.tacticalWidget.playChime();
    });

    // Form submit handler
    const form = document.getElementById('loginForm');
    const errBanner = document.getElementById('loginError');
    const errMsg = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBanner.classList.remove('show');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      if (window.tacticalWidget) window.tacticalWidget.playClick(1100);

      const success = await window.AzamAuth.login(user, pass, remember);
      if (success) {
        if (window.tacticalWidget) {
          window.tacticalWidget.playChime();
          window.tacticalWidget.speak("Access granted. Loading Studio Deck.");
        }
        setTimeout(() => {
          window.location.href = '/';
        }, 350);
      } else {
        if (window.tacticalWidget) window.tacticalWidget.playEmp();
        errMsg.textContent = 'Invalid credentials. Please enter azam / azam.';
        errBanner.classList.add('show');
      }
    });

    // If already logged in, redirect to main studio
    window.addEventListener('DOMContentLoaded', async () => {
      if (await window.AzamAuth.checkAuth(false)) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
